image:
  repository: registry.apex.romanzipp.cloud/linke-calendar-image
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion (== the git tag the chart was packaged from).
  tag: ""

# Keep K8s resource names as `linke-calendar` even though the chart is `linke-calendar-chart`.
fullnameOverride: linke-calendar

# Cluster-specific image pull credentials. Populated from apex.
#   imagePullSecrets:
#     - name: image-pull
imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Ingress is opt-in. Cluster-specific values (className, annotations,
# hosts, TLS) live in the apex Argo Application's helm.values. Example:
#   ingress:
#     enabled: true
#     className: haproxy
#     annotations:
#       cert-manager.io/cluster-issuer: letsencrypt-prod
#       haproxy.org/ssl-redirect: "true"
#     hosts:
#       - host: linke-calendar.example.com
#         paths:
#           - path: /
#             pathType: Prefix
#     tls:
#       - secretName: linke-calendar-tls
#         hosts:
#           - linke-calendar.example.com
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

persistence:
  enabled: true
  storageClass: ""
  size: 1Gi
  # SQLite scrape cache. ReadWriteOnce + Recreate is intentional (single replica).
  accessMode: ReadWriteOnce
  mountPath: /app/data

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

# config.yaml contents — rendered into a ConfigMap and mounted at /app/config.yaml.
config:
  scraper:
    max_pages: 10
    interval: "6h"
    timeout: "30s"
  server:
    port: "8080"
    host: "0.0.0.0"

probes:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 2
    periodSeconds: 5
