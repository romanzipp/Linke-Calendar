apiVersion: v1
kind: Service
metadata:
  name: {{ include "linke-calendar.fullname" . }}
  labels:
    {{- include "linke-calendar.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "linke-calendar.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
