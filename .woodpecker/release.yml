# Tag-triggered release pipeline.
# Tag without `v` prefix (e.g. `1.0.0`, `1.2.3-rc.1`).
# Woodpecker uses doublestar glob — `*` matches anything, no `+` quantifier.
when:
  - event: tag
    ref: refs/tags/[0-9]*.[0-9]*.[0-9]*

# Registry hostname, full image repo, and argocd server are pulled from
# Woodpecker secrets so the same pipeline works across environments:
#   container_registry
#   container_image_repo
#   registry_username      registry login user
#   registry_token         registry login token
#   argocd_server
#   argocd_auth_token      argocd API token

variables:
  - &step_resources
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1Gi

steps:
  - name: build-and-push-image
    image: woodpeckerci/plugin-docker-buildx
    <<: *step_resources
    settings:
      registry:
        from_secret: container_registry
      repo:
        from_secret: container_image_repo
      tags:
        - ${CI_COMMIT_TAG}
        - latest
      username:
        from_secret: registry_username
      password:
        from_secret: registry_token
      build_args:
        VERSION: ${CI_COMMIT_TAG}

  - name: package-and-push-chart
    image: alpine/helm:3.16.2
    <<: *step_resources
    environment:
      CONTAINER_REGISTRY:
        from_secret: container_registry
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_TOKEN:
        from_secret: registry_token
    commands:
      - echo "$REGISTRY_TOKEN" | helm registry login "$CONTAINER_REGISTRY"
        --username "$REGISTRY_USERNAME" --password-stdin
      - helm package deploy/helm/linke-calendar --version "$CI_COMMIT_TAG"
        --app-version "$CI_COMMIT_TAG" --destination dist/
      - helm push "dist/linke-calendar-chart-${CI_COMMIT_TAG}.tgz"
        "oci://$CONTAINER_REGISTRY"

  - name: argocd-sync
    image: quay.io/argoproj/argocd:v2.13.1
    <<: *step_resources
    environment:
      CONTAINER_REGISTRY:
        from_secret: container_registry
      ARGOCD_SERVER:
        from_secret: argocd_server
      ARGOCD_AUTH_TOKEN:
        from_secret: argocd_auth_token
    commands:
      # Create-or-update the Application. The OCI Helm repo
      # ($CONTAINER_REGISTRY) must already be registered with credentials
      # in Argo CD.
      - |
        argocd app create linke-calendar \
          --upsert \
          --repo "$CONTAINER_REGISTRY" \
          --helm-chart linke-calendar-chart \
          --revision "$CI_COMMIT_TAG" \
          --dest-server https://kubernetes.default.svc \
          --dest-namespace linke-calendar \
          --project default \
          --release-name linke-calendar \
          --sync-policy automated \
          --self-heal \
          --sync-option CreateNamespace=true \
          --sync-option ServerSideApply=true \
          --server "$ARGOCD_SERVER" --grpc-web
      # `app create --upsert` may have already triggered an automated sync.
      # Wait for any in-flight op before issuing our own sync.
      - argocd app wait linke-calendar --server "$ARGOCD_SERVER" --grpc-web
        --operation --timeout 600
      - argocd app sync linke-calendar --server "$ARGOCD_SERVER" --grpc-web
        --timeout 600
      - argocd app wait linke-calendar --server "$ARGOCD_SERVER" --grpc-web
        --health --timeout 600
